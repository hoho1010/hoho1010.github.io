<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青チャート 数学II 理解度トラッカー（1〜6回目対応）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .attempt-btn {
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .attempt-btn:active {
      transform: scale(0.92);
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- ヘッダー -->
  <header class="bg-blue-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="bg-blue-600 text-white text-xs font-black px-2 py-1 rounded tracking-wider border border-blue-400">青チャート</span>
        <h1 class="text-base sm:text-lg font-bold tracking-tight">数学II 理解度トラッカー <span class="text-blue-300 text-xs font-normal">(例題1〜262)</span></h1>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="exportCSV()" class="bg-blue-700 hover:bg-blue-600 text-xs font-bold px-2.5 py-1.5 rounded border border-blue-500 transition flex items-center gap-1">
          <span>📥 CSV出力</span>
        </button>
        <label class="bg-blue-800 hover:bg-blue-700 text-xs font-bold px-2.5 py-1.5 rounded border border-blue-600 transition cursor-pointer flex items-center gap-1">
          <span>📤 CSV読込</span>
          <input type="file" id="csvInput" accept=".csv" class="hidden" onchange="importCSV(event)" />
        </label>
        <button onclick="resetAllData()" class="bg-rose-800 hover:bg-rose-700 text-xs font-bold px-2.5 py-1.5 rounded border border-rose-600 transition">
          初期化
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-4 pt-4 space-y-4">

    <!-- 進捗ダッシュボード -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 sm:p-4">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <span class="w-2 h-4 bg-blue-700 rounded-sm inline-block"></span>
          全体の達成状況（最新評価ベース）
        </h2>
        <div class="text-xs text-slate-500" id="lastSavedText">自動保存済み</div>
      </div>

      <!-- メイン進捗バー＆ステータス内訳 -->
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-3">
        <div onclick="setQuickFilter('all')" class="cursor-pointer bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2.5 transition">
          <div class="text-[11px] text-slate-500 font-bold">達成率（最新◯）</div>
          <div class="text-xl font-black text-blue-800" id="statRate">0.0%</div>
          <div class="w-full bg-slate-200 h-1.5 rounded-full mt-1 overflow-hidden">
            <div id="statProgressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
        <div onclick="setQuickFilter('latest_circle')" class="cursor-pointer bg-emerald-50/70 hover:bg-emerald-100/70 border border-emerald-200 rounded-lg p-2.5 transition">
          <div class="text-[11px] text-emerald-700 font-bold">◯ 理解済み</div>
          <div class="text-xl font-black text-emerald-700" id="statCircle">0 <span class="text-xs font-normal">/ 262</span></div>
        </div>
        <div onclick="setQuickFilter('latest_triangle')" class="cursor-pointer bg-amber-50/70 hover:bg-amber-100/70 border border-amber-200 rounded-lg p-2.5 transition">
          <div class="text-[11px] text-amber-700 font-bold">▲ もう少し</div>
          <div class="text-xl font-black text-amber-600" id="statTriangle">0 <span class="text-xs font-normal">/ 262</span></div>
        </div>
        <div onclick="setQuickFilter('latest_cross')" class="cursor-pointer bg-rose-50/70 hover:bg-rose-100/70 border border-rose-200 rounded-lg p-2.5 transition">
          <div class="text-[11px] text-rose-700 font-bold">✕ 要復習</div>
          <div class="text-xl font-black text-rose-600" id="statCross">0 <span class="text-xs font-normal">/ 262</span></div>
        </div>
        <div onclick="setQuickFilter('unattempted')" class="col-span-2 sm:col-span-1 cursor-pointer bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg p-2.5 transition">
          <div class="text-[11px] text-slate-500 font-bold">ー 未着手</div>
          <div class="text-xl font-black text-slate-600" id="statNone">262 <span class="text-xs font-normal">/ 262</span></div>
        </div>
      </div>

      <!-- 1回目〜6回目 周回別サマリー -->
      <div class="border-t border-slate-100 pt-2.5">
        <div class="text-[11px] font-bold text-slate-500 mb-1.5">周回別集計（タップでその回の✕・▲を抽出）</div>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5" id="roundSummaryGrid">
          <!-- JSで1〜6回目カードを生成 -->
        </div>
      </div>
    </section>

    <!-- 絞り込み・検索パネル -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 space-y-2.5">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <!-- 章フィルター -->
        <div class="sm:col-span-4">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">章（単元）で絞り込み</label>
          <select id="chapterFilter" onchange="renderList()" class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 focus:outline-none focus:border-blue-600 font-medium">
            <option value="all">すべての章（1〜262）</option>
            <option value="1">第1章 式と証明（1〜42）</option>
            <option value="2">第2章 複素数と方程式（43〜76）</option>
            <option value="3">第3章 図形と方程式（77〜128）</option>
            <option value="4">第4章 三角関数（129〜167）</option>
            <option value="5">第5章 指数関数と対数関数（168〜198）</option>
            <option value="6">第6章 微分法と積分法（199〜262）</option>
          </select>
        </div>

        <!-- ステータスフィルター -->
        <div class="sm:col-span-4">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">理解度・回数で絞り込み</label>
          <select id="statusFilter" onchange="renderList()" class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 focus:outline-none focus:border-blue-600 font-medium">
            <option value="all">すべて表示</option>
            <option value="review_needed">★ 要復習（最新が ✕ または ▲）</option>
            <option value="latest_cross">最新が ✕ のみ</option>
            <option value="latest_triangle">最新が ▲ のみ</option>
            <option value="latest_circle">最新が ◯ のみ</option>
            <option value="unattempted">未着手（すべて ー）</option>
            <optgroup label="回数別：✕・▲だった問題">
              <option value="r1_bad">1回目で ✕・▲</option>
              <option value="r2_bad">2回目で ✕・▲</option>
              <option value="r3_bad">3回目で ✕・▲</option>
              <option value="r4_bad">4回目で ✕・▲</option>
              <option value="r5_bad">5回目で ✕・▲</option>
              <option value="r6_bad">6回目で ✕・▲</option>
            </optgroup>
            <optgroup label="回数別：未実施の問題">
              <option value="r1_none">1回目 未実施</option>
              <option value="r2_none">2回目 未実施</option>
              <option value="r3_none">3回目 未実施</option>
              <option value="r4_none">4回目 未実施</option>
              <option value="r5_none">5回目 未実施</option>
              <option value="r6_none">6回目 未実施</option>
            </optgroup>
          </select>
        </div>

        <!-- 番号・範囲・メモ検索 -->
        <div class="sm:col-span-4">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">問題番号 / 範囲(例: 180-190) / メモ検索</label>
          <div class="relative">
            <input type="text" id="searchInput" oninput="renderList()" placeholder="例: 187 や 180-195 や 対数" class="w-full text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:border-blue-600" />
            <button onclick="clearFilters()" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs font-bold px-1" title="条件クリア">✕</button>
          </div>
        </div>
      </div>

      <!-- 凡例＆表示件数 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-xs text-slate-500 border-t border-slate-100">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold text-slate-600">ボタン操作:</span>
          <span>タップで <b class="text-slate-600">ー</b> → <b class="text-emerald-600">◯</b> → <b class="text-amber-600">▲</b> → <b class="text-rose-600">✕</b> 切替</span>
        </div>
        <div class="font-bold text-blue-900" id="visibleCountText">表示中: 262 / 262 問</div>
      </div>
    </section>

    <!-- 問題リスト -->
    <section id="problemList" class="space-y-2">
      <!-- JSで1〜262のカードを描画 -->
    </section>

  </main>

  <script>
    const TOTAL_PROBLEMS = 262;
    const MAX_ROUNDS = 6;
    const STORAGE_KEY = 'aochart_math2_tracker_v2';
    const LEGACY_STORAGE_KEY = 'aochart_math2_tracker_v1';

    // 状態サイクル: 0=未(ー), 1=◯, 2=▲, 3=✕
    const STATES = [
      { code: 0, label: 'ー', btnClass: 'bg-slate-100 text-slate-400 border-slate-200 hover:bg-slate-200' },
      { code: 1, label: '◯', btnClass: 'bg-emerald-500 text-white border-emerald-600 shadow-sm font-black' },
      { code: 2, label: '▲', btnClass: 'bg-amber-400 text-slate-900 border-amber-500 shadow-sm font-black' },
      { code: 3, label: '✕', btnClass: 'bg-rose-500 text-white border-rose-600 shadow-sm font-black' }
    ];

    // 青チャート数学II（新課程目安）の章区分
    const CHAPTERS = [
      { id: 1, name: '第1章 式と証明', start: 1, end: 42 },
      { id: 2, name: '第2章 複素数と方程式', start: 43, end: 76 },
      { id: 3, name: '第3章 図形と方程式', start: 77, end: 128 },
      { id: 4, name: '第4章 三角関数', start: 129, end: 167 },
      { id: 5, name: '第5章 指数・対数関数', start: 168, end: 198 },
      { id: 6, name: '第6章 微分法・積分法', start: 199, end: 262 }
    ];

    function getChapter(num) {
      return CHAPTERS.find(c => num >= c.start && num <= c.end) || CHAPTERS[0];
    }

    // データ配列の初期化・読み込み
    let records = [];

    function initData() {
      const savedV2 = localStorage.getItem(STORAGE_KEY);
      if (savedV2) {
        try {
          const parsed = JSON.parse(savedV2);
          if (Array.isArray(parsed) && parsed.length === TOTAL_PROBLEMS) {
            records = parsed.map((item, idx) => ({
              id: idx + 1,
              attempts: normalizeAttempts(item.attempts),
              memo: typeof item.memo === 'string' ? item.memo : ''
            }));
            return;
          }
        } catch (e) {
          console.error('データ読み込みエラー:', e);
        }
      }

      // 5回版の旧データがあれば6回版に自動移行
      const savedV1 = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (savedV1) {
        try {
          const parsedV1 = JSON.parse(savedV1);
          if (Array.isArray(parsedV1) && parsedV1.length === TOTAL_PROBLEMS) {
            records = parsedV1.map((item, idx) => ({
              id: idx + 1,
              attempts: normalizeAttempts(item.attempts),
              memo: typeof item.memo === 'string' ? item.memo : ''
            }));
            saveData();
            return;
          }
        } catch (e) {
          console.error('旧データ移行エラー:', e);
        }
      }

      // 新規作成
      records = Array.from({ length: TOTAL_PROBLEMS }, (_, i) => ({
        id: i + 1,
        attempts: [0, 0, 0, 0, 0, 0],
        memo: ''
      }));
    }

    function normalizeAttempts(arr) {
      const res = [0, 0, 0, 0, 0, 0];
      if (Array.isArray(arr)) {
        for (let i = 0; i < MAX_ROUNDS; i++) {
          const val = Number(arr[i]);
          res[i] = [0, 1, 2, 3].includes(val) ? val : 0;
        }
      }
      return res;
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('lastSavedText').textContent = `最終保存: ${timeStr}`;
    }

    // 最新の評価を取得（1〜6回目のうち、未着手(0)でない最後の評価）
    function getLatestStatus(attempts) {
      for (let i = MAX_ROUNDS - 1; i >= 0; i--) {
        if (attempts[i] !== 0) return attempts[i];
      }
      return 0;
    }

    // 周回ボタンのクリック処理
    function toggleAttempt(problemId, roundIndex) {
      const rec = records[problemId - 1];
      rec.attempts[roundIndex] = (rec.attempts[roundIndex] + 1) % 4;
      saveData();
      updateRowUI(problemId);
      updateDashboard();
    }

    // メモ変更処理
    function updateMemo(problemId, value) {
      records[problemId - 1].memo = value;
      saveData();
    }

    // 個別行のUIだけ高速更新
    function updateRowUI(problemId) {
      const rec = records[problemId - 1];
      const latest = getLatestStatus(rec.attempts);
      const rowEl = document.getElementById(`row-${problemId}`);
      const badgeEl = document.getElementById(`badge-${problemId}`);

      if (!rowEl || !badgeEl) return;

      // 行の背景と左枠線スタイル
      rowEl.className = getRowClass(latest);
      badgeEl.className = getBadgeClass(latest);
      badgeEl.textContent = STATES[latest].label;

      // 各回のボタン更新
      for (let r = 0; r < MAX_ROUNDS; r++) {
        const btn = document.getElementById(`btn-${problemId}-${r}`);
        if (btn) {
          const st = STATES[rec.attempts[r]];
          btn.className = `attempt-btn h-9 sm:h-8 rounded-md border text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-0.5 ${st.btnClass}`;
          btn.innerHTML = `<span class="text-[9px] sm:text-[10px] opacity-75 font-normal">${r + 1}回</span><span>${st.label}</span>`;
        }
      }
    }

    function getRowClass(latest) {
      const base = 'rounded-xl border p-2.5 sm:px-3.5 sm:py-2.5 transition-colors shadow-xs ';
      if (latest === 1) return base + 'bg-emerald-50/40 border-emerald-200';
      if (latest === 2) return base + 'bg-amber-50/50 border-amber-200';
      if (latest === 3) return base + 'bg-rose-50/50 border-rose-200';
      return base + 'bg-white border-slate-200';
    }

    function getBadgeClass(latest) {
      const base = 'w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black shrink-0 ';
      if (latest === 1) return base + 'bg-emerald-100 text-emerald-700 border border-emerald-300';
      if (latest === 2) return base + 'bg-amber-100 text-amber-700 border border-amber-300';
      if (latest === 3) return base + 'bg-rose-100 text-rose-700 border border-rose-300';
      return base + 'bg-slate-100 text-slate-400 border border-slate-200';
    }

    // ダッシュボード集計更新
    function updateDashboard() {
      let circle = 0, triangle = 0, cross = 0, none = 0;
      const roundStats = Array.from({ length: MAX_ROUNDS }, () => ({ done: 0, circle: 0, bad: 0 }));

      records.forEach(rec => {
        const latest = getLatestStatus(rec.attempts);
        if (latest === 1) circle++;
        else if (latest === 2) triangle++;
        else if (latest === 3) cross++;
        else none++;

        for (let r = 0; r < MAX_ROUNDS; r++) {
          const val = rec.attempts[r];
          if (val !== 0) {
            roundStats[r].done++;
            if (val === 1) roundStats[r].circle++;
            if (val === 2 || val === 3) roundStats[r].bad++;
          }
        }
      });

      const rate = ((circle / TOTAL_PROBLEMS) * 100).toFixed(1);
      document.getElementById('statRate').textContent = `${rate}%`;
      document.getElementById('statProgressBar').style.width = `${rate}%`;
      document.getElementById('statCircle').innerHTML = `${circle} <span class="text-xs font-normal">/ ${TOTAL_PROBLEMS}</span>`;
      document.getElementById('statTriangle').innerHTML = `${triangle} <span class="text-xs font-normal">/ ${TOTAL_PROBLEMS}</span>`;
      document.getElementById('statCross').innerHTML = `${cross} <span class="text-xs font-normal">/ ${TOTAL_PROBLEMS}</span>`;
      document.getElementById('statNone').innerHTML = `${none} <span class="text-xs font-normal">/ ${TOTAL_PROBLEMS}</span>`;

      // 1〜6回目サマリーカード生成
      const grid = document.getElementById('roundSummaryGrid');
      grid.innerHTML = roundStats.map((st, idx) => {
        const rNum = idx + 1;
        return `
          <button onclick="setQuickFilter('r${rNum}_bad')" class="text-left bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-lg p-2 transition">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-blue-900">${rNum}回目</span>
              <span class="text-[10px] text-slate-500">済 ${st.done}</span>
            </div>
            <div class="mt-1 flex items-center justify-between text-[11px]">
              <span class="text-emerald-700 font-bold">◯ ${st.circle}</span>
              <span class="text-rose-600 font-bold">▲✕ ${st.bad}</span>
            </div>
          </button>
        `;
      }).join('');
    }

    // クイックフィルター設定
    function setQuickFilter(statusVal) {
      document.getElementById('statusFilter').value = statusVal;
      renderList();
    }

    function clearFilters() {
      document.getElementById('chapterFilter').value = 'all';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('searchInput').value = '';
      renderList();
    }

    // リスト描画
    function renderList() {
      const chapterVal = document.getElementById('chapterFilter').value;
      const statusVal = document.getElementById('statusFilter').value;
      const searchRaw = document.getElementById('searchInput').value.trim();

      // 範囲検索の解析 (例: "180-190" や "180〜190")
      let rangeStart = null, rangeEnd = null;
      const rangeMatch = searchRaw.match(/^(\d+)\s*[-〜~]\s*(\d+)$/);
      if (rangeMatch) {
        rangeStart = Math.min(Number(rangeMatch[1]), Number(rangeMatch[2]));
        rangeEnd = Math.max(Number(rangeMatch[1]), Number(rangeMatch[2]));
      }

      const filtered = records.filter(rec => {
        // 章フィルター
        if (chapterVal !== 'all') {
          const ch = getChapter(rec.id);
          if (String(ch.id) !== chapterVal) return false;
        }

        // ステータスフィルター
        const latest = getLatestStatus(rec.attempts);
        if (statusVal === 'review_needed' && latest !== 2 && latest !== 3) return false;
        if (statusVal === 'latest_cross' && latest !== 3) return false;
        if (statusVal === 'latest_triangle' && latest !== 2) return false;
        if (statusVal === 'latest_circle' && latest !== 1) return false;
        if (statusVal === 'unattempted' && latest !== 0) return false;

        // 回数別フィルター (r1_bad 〜 r6_bad / r1_none 〜 r6_none)
        const rBadMatch = statusVal.match(/^r([1-6])_bad$/);
        if (rBadMatch) {
          const rIdx = Number(rBadMatch[1]) - 1;
          const v = rec.attempts[rIdx];
          if (v !== 2 && v !== 3) return false;
        }
        const rNoneMatch = statusVal.match(/^r([1-6])_none$/);
        if (rNoneMatch) {
          const rIdx = Number(rNoneMatch[1]) - 1;
          if (rec.attempts[rIdx] !== 0) return false;
        }

        // 検索フィルター
        if (searchRaw !== '') {
          if (rangeStart !== null && rangeEnd !== null) {
            if (rec.id < rangeStart || rec.id > rangeEnd) return false;
          } else if (/^\d+$/.test(searchRaw)) {
            if (!String(rec.id).includes(searchRaw)) return false;
          } else {
            const q = searchRaw.t
